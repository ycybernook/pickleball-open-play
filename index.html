<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pickleball Open Play Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --court-navy:#0A121C; --panel:#121D2B; --panel2:#182636; --panel3:#1E3046;
    --border:#26384D; --border-bright:#33506E;
    --text:#F2F7FB; --muted:#8FA3B8; --muted2:#6B8199;
    --ball:#E4FF3D; --ball-deep:#C7DE1F; --court-green:#18B368; --court-green-deep:#0E4A32;
    --amber:#F5A524; --amber-bg:#3A2C0E; --red:#EF4444; --red-bg:#3B1414;
    --gray-bg:#1A2634;
    --font-head:'Barlow Condensed',sans-serif; --font-body:'Barlow',-apple-system,BlinkMacSystemFont,sans-serif;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);background:var(--court-navy);color:var(--text);-webkit-font-smoothing:antialiased;}
  button,input,select{font-family:inherit;}
  button{cursor:pointer;}
  h1,h2,h3{font-family:var(--font-head);letter-spacing:.01em;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border-bright);border-radius:6px;}

  .icon{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;flex:none;}
  .icon svg{width:100%;height:100%;}
  .icon.lg{width:28px;height:28px;}
  .icon.xl{width:44px;height:44px;}

  .app{min-height:100vh;display:flex;flex-direction:column;}
  .btn{background:var(--panel3);border:1px solid var(--border-bright);color:var(--text);padding:9px 16px;border-radius:9px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:background .15s,border-color .15s,transform .1s;min-height:40px;}
  .btn:hover{border-color:var(--ball);}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:var(--ball);border-color:var(--ball);color:#111;}
  .btn.primary:hover{background:var(--ball-deep);}
  .btn.danger{background:var(--red);border-color:var(--red);color:#fff;}
  .btn.icon{padding:9px 11px;}
  .btn.small{padding:6px 11px;font-size:12.5px;min-height:32px;}
  .btn.link{background:transparent;border:none;color:var(--muted);text-decoration:underline;padding:6px 4px;min-height:auto;}
  .btn.full{width:100%;justify-content:center;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  /* ---------- Kiosk ---------- */
  .kiosk-hero{position:relative;background-image:linear-gradient(100deg,rgba(10,18,28,.94) 15%,rgba(10,18,28,.55) 60%,rgba(10,18,28,.85)),url('https://raw.githubusercontent.com/ycybernook/pickleball-open-play/main/hero.png');background-size:cover;background-position:center 30%;padding:28px 32px;border-bottom:3px solid var(--ball);}
  .kiosk-hero-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
  .kiosk-brand{display:flex;flex-direction:column;gap:2px;}
  .kiosk-brand .kicker{font-family:var(--font-head);font-weight:700;font-size:15px;letter-spacing:.18em;color:var(--ball);text-transform:uppercase;}
  .kiosk-brand h1{margin:0;font-size:44px;font-weight:800;line-height:1;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.5);}
  .kiosk-clock{font-family:var(--font-head);font-size:28px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums;}
  .kiosk-hero-actions{display:flex;gap:10px;align-items:center;}
  .demo-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#241a03;background:var(--amber);padding:3px 9px;border-radius:20px;margin-top:6px;width:fit-content;}
  .demo-badge.inline{margin-top:0;margin-left:6px;vertical-align:middle;font-size:9.5px;padding:2px 7px;}

  .kiosk{padding:26px 32px;display:flex;flex-direction:column;gap:26px;}
  .kiosk-section-title{font-size:26px;font-weight:700;margin:0 0 14px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:10px;}
  .kiosk-courts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;}
  .kiosk-court{position:relative;border-radius:20px;padding:22px;border:2px solid var(--border);background:var(--gray-bg);overflow:hidden;min-height:230px;transition:background .3s,border-color .3s;}
  .kiosk-court.playing{background:var(--court-green-deep);border-color:var(--court-green);}
  .kiosk-court.ending{background:var(--amber-bg);border-color:var(--amber);}
  .kiosk-court.timeup{background:var(--red-bg);border-color:var(--red);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.6);}50%{box-shadow:0 0 0 10px rgba(239,68,68,0);}}
  .kiosk-court-head{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2;}
  .kiosk-court h3{margin:0;font-size:30px;font-weight:700;color:#fff;}
  .kiosk-status-pill{font-size:13px;font-weight:700;padding:5px 12px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em;background:rgba(0,0,0,.35);color:#fff;}
  .kiosk-timer{font-family:var(--font-head);font-size:56px;font-weight:800;text-align:center;margin:8px 0;font-variant-numeric:tabular-nums;color:#fff;position:relative;z-index:2;}
  .kiosk-players{list-style:none;margin:6px 0 0;padding:0;font-size:22px;font-weight:600;display:flex;flex-direction:column;gap:6px;position:relative;z-index:2;color:#fff;}
  .kiosk-empty{font-size:19px;color:var(--muted);text-align:center;padding:26px 0;}
  .camera-frame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0;z-index:0;}
  .camera-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,.05) 40%,rgba(0,0,0,.75) 100%);z-index:1;}
  .live-badge{position:absolute;top:16px;right:16px;background:var(--red);color:#fff;font-size:11px;font-weight:800;letter-spacing:.08em;padding:4px 9px;border-radius:6px;z-index:2;display:flex;align-items:center;gap:5px;}
  .live-dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.4s infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}
  .kiosk-court.has-camera .kiosk-players{position:absolute;bottom:16px;left:20px;right:20px;font-size:18px;}
  .kiosk-court.has-camera .kiosk-timer{position:absolute;top:56px;left:0;right:0;font-size:44px;}
  .kiosk-court.has-camera .kiosk-status-pill{}

  .kiosk-queue{background:var(--panel);border-radius:20px;padding:24px;border:2px solid var(--border);}
  .kiosk-queue-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;font-size:21px;font-weight:600;}
  .kiosk-queue-list li{background:var(--panel2);border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;}
  .kiosk-queue-list li .pos{color:var(--ball);font-weight:800;margin-right:10px;font-family:var(--font-head);}

  /* ---------- Auth ---------- */
  .auth-shell{min-height:100vh;background-image:linear-gradient(160deg,rgba(10,18,28,.92),rgba(10,18,28,.7) 55%,rgba(10,18,28,.95)),url('https://raw.githubusercontent.com/ycybernook/pickleball-open-play/main/hero.png');background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;padding:24px;}
  .auth-card{width:100%;max-width:400px;background:rgba(18,29,43,.9);backdrop-filter:blur(6px);border:1px solid var(--border-bright);border-radius:18px;padding:32px 30px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .auth-brand{display:flex;align-items:center;gap:9px;color:var(--ball);font-weight:700;font-family:var(--font-head);font-size:16px;letter-spacing:.05em;text-transform:uppercase;}
  .auth-card h2{margin:0 0 4px;font-size:26px;color:#fff;}
  .auth-hint{font-size:12.5px;color:var(--muted);margin:-6px 0 4px;line-height:1.5;}
  .auth-error{background:var(--red-bg);border:1px solid var(--red);color:#fca5a5;padding:9px 12px;border-radius:9px;font-size:13px;}
  .auth-card label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:5px;font-weight:600;}
  .auth-card input{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:11px 12px;border-radius:9px;font-size:15px;min-height:44px;}
  .auth-card input:focus{outline:2px solid var(--ball);outline-offset:1px;border-color:var(--ball);}
  .auth-demo-creds{margin-top:4px;padding-top:12px;border-top:1px dashed var(--border);font-size:12px;color:var(--muted);text-align:center;line-height:1.6;}
  .auth-demo-creds strong{color:var(--ball);font-weight:700;}

  /* ---------- App shell (organizer/admin) ---------- */
  main{flex:1;padding:20px 24px;display:flex;flex-direction:column;gap:20px;}
  header.appbar{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:20;}
  .appbar-left{display:flex;flex-direction:column;gap:2px;}
  .appbar-left .brand{font-family:var(--font-head);font-weight:700;font-size:19px;display:flex;align-items:center;gap:8px;color:#fff;}
  .save-indicator{font-size:11.5px;color:var(--muted);min-height:14px;}
  .save-indicator.saved{color:var(--court-green);}
  .tabs{display:flex;gap:4px;background:var(--panel2);border-radius:10px;border:1px solid var(--border);padding:3px;}
  .tabs button{background:transparent;border:none;color:var(--muted);padding:8px 16px;border-radius:8px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;min-height:36px;}
  .tabs button.active{background:var(--ball);color:#111;}
  .appbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .role-badge{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:20px;background:var(--panel3);color:var(--ball);border:1px solid var(--border-bright);}
  .role-badge.admin{background:var(--ball);color:#111;}

  .org-grid{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start;}
  @media (max-width:960px){.org-grid{grid-template-columns:1fr;}}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
  .panel h2{margin:0 0 12px;font-size:16px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px;font-weight:700;}

  .courts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
  .court-card{border-radius:var(--radius);padding:14px;border:1px solid var(--border);position:relative;transition:background .3s,border-color .3s;background:var(--gray-bg);}
  .court-card.playing{background:var(--court-green-deep);border-color:var(--court-green);}
  .court-card.ending{background:var(--amber-bg);border-color:var(--amber);}
  .court-card.timeup{animation:pulse 1s infinite;background:var(--red-bg);border-color:var(--red);}
  .court-card.dragover{outline:2px dashed var(--ball);}
  .court-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .court-name{font-family:var(--font-head);font-weight:700;font-size:18px;}
  .status-pill{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700;text-transform:uppercase;}
  .status-pill.playing{background:var(--court-green);color:#04150c;}
  .status-pill.ending{background:var(--amber);color:#241a03;}
  .status-pill.open{background:var(--panel3);color:var(--muted);}
  .court-timer{font-family:var(--font-head);font-size:30px;font-weight:800;text-align:center;margin:6px 0;font-variant-numeric:tabular-nums;}
  .court-players{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;min-height:40px;}
  .player-chip{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:13.5px;display:flex;justify-content:space-between;gap:6px;cursor:grab;}
  .player-chip .rating{color:var(--muted);font-size:11px;}
  .court-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .court-slot-empty{border:1px dashed var(--border);border-radius:8px;padding:7px;font-size:12px;color:var(--muted);text-align:center;}

  .camera-config{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);display:flex;flex-direction:column;gap:7px;}
  .camera-toggle{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);font-weight:600;cursor:pointer;}
  .camera-toggle input{width:16px;height:16px;}
  .camera-config input[type=text]{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:7px 9px;border-radius:7px;font-size:12.5px;width:100%;}

  .checkin-form{display:flex;flex-direction:column;gap:9px;}
  .checkin-form .row{display:flex;gap:8px;}
  .checkin-form input,.checkin-form select{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px 11px;border-radius:8px;font-size:14px;min-height:42px;}

  .queue-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto;}
  .queue-item{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:8px 10px;cursor:grab;}
  .queue-item .pos{font-size:11px;color:var(--muted);width:18px;text-align:center;font-weight:700;}
  .queue-item .name{flex:1;font-size:14px;font-weight:600;}
  .queue-item .rating{font-size:11px;color:var(--muted);}
  .queue-item .wait{font-size:11px;color:var(--ball);font-weight:600;}
  .queue-item.dragover{outline:2px dashed var(--ball);}

  .settings-grid{display:flex;flex-direction:column;gap:12px;}
  .settings-grid label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:5px;font-weight:600;}
  .settings-grid input,.settings-grid select{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:8px;font-size:14px;min-height:38px;}
  .toggle-row{display:flex;gap:6px;}
  .toggle-row button{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:8px;border-radius:8px;font-size:12.5px;font-weight:600;min-height:36px;}
  .toggle-row button.active{background:var(--ball);color:#111;border-color:var(--ball);}

  table.roster{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.roster th,table.roster td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);}
  table.roster th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  .badge{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--panel3);color:var(--muted);font-weight:700;}
  .badge.court{background:var(--court-green);color:#04150c;}
  .badge.queue{background:var(--ball);color:#111;}
  .badge.admin{background:var(--ball);color:#111;}

  .stats-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px;}
  .stat-tile{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;}
  .stat-num{display:block;font-family:var(--font-head);font-size:38px;font-weight:800;color:var(--ball);}
  .stat-label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
  .mvp-card{display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,var(--court-green-deep),var(--panel2));border:1px solid var(--court-green);border-radius:14px;padding:16px 18px;margin-bottom:18px;color:#fff;}
  .mvp-card .icon{color:var(--ball);}
  .mvp-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;}
  .mvp-name{font-family:var(--font-head);font-size:22px;font-weight:700;}
  .mvp-games{margin-left:auto;font-family:var(--font-head);font-size:22px;font-weight:800;color:var(--ball);}

  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:420px;width:100%;}
  .modal h3{margin-top:0;font-size:20px;}
  .modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

  .print-area{display:none;}
  @media print{
    body > *:not(.print-area){display:none !important;}
    .print-area{display:block !important;position:absolute;top:0;left:0;width:100%;padding:20px;color:#000;background:#fff;}
    .print-area table{width:100%;border-collapse:collapse;}
    .print-area th,.print-area td{border:1px solid #999;padding:6px 8px;font-size:12px;color:#000;}
  }
  .empty-state{color:var(--muted);font-size:13px;text-align:center;padding:22px 0;}
  @media (max-width:640px){
    .kiosk-brand h1{font-size:30px;}
    .kiosk-hero{padding:20px;}
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="printArea" class="print-area"></div>
<script type="module">

// ---------------- Icons (inline SVG, no emoji) ----------------
const ICONS = {

  logout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M16 17l5-5-5-5M21 12H9"/></svg>',
  courts: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M12 4v16M3 12h18"/></svg>',

function icon(name, extra){ return `<span class="icon${extra?" "+extra:""}">${ICONS[name]||""}</span>`; }

function defaultSettings(){
  return { numCourts: 6, gameMinutes: 30, endingSoonMinutes: 2, playersPerCourt: 4, skillMode: "off" };
}

function newCourt(i){
  return { id: uid(), label: "Court "+(i+1), playerIds: [], status: "open", startTime: null, endTime: null, cameraUrl: "", cameraEnabled: false };
}

function defaultState(){
  const s = defaultSettings();
  return {
    players: {},
    queueIds: [],
    courts: Array.from({length: s.numCourts}, (_,i)=>newCourt(i)),
    outIds: [],
    settings: s,
    sessionStart: Date.now(),
  };
}

function migrateState(parsed){
  parsed.courts.forEach(c=>{
    if(c.cameraUrl === undefined) c.cameraUrl = "";
    if(c.cameraEnabled === undefined) c.cameraEnabled = false;
  });
  return parsed;
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    if(!parsed.players || !parsed.courts) return defaultState();
    return migrateState(parsed);
  }catch(e){ return defaultState(); }
}

function fmtClock(ms){
  if(ms==null) return "--:--";
  const neg = ms < 0;
  const s = Math.floor(Math.abs(ms)/1000);
  const m = Math.floor(s/60);
  const sec = s%60;
  return (neg?"-":"")+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
}
function fmtTime(ts){
  if(!ts) return "";
  return new Date(ts).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
}
function fmtWait(ms){
  const m = Math.floor(ms/60000);
  if(m < 1) return "just now";
  if(m < 60) return m+"m";
  return Math.floor(m/60)+"h "+(m%60)+"m";
}

function courtStatusClass(court, settings, now){
  if(court.status !== "playing") return "open";
  const remain = court.endTime - now;
  if(remain <= 0) return "timeup";
  if(remain <= settings.endingSoonMinutes*60000) return "ending";
  return "playing";
}

function pickNextGroup(queueIds, players, count, skillMode){
  if(queueIds.length < count) return null;
  if(skillMode !== "balance"){
    return { chosen: queueIds.slice(0,count), rest: queueIds.slice(count) };
  }
  const anchorId = queueIds[0];
  const anchor = players[anchorId];
  const remaining = queueIds.slice(1);
  const scored = remaining.map((id, idx) => ({ id, idx, diff: Math.abs((players[id].rating||0) - (anchor.rating||0)) }));
  scored.sort((a,b) => (a.diff - b.diff) || (a.idx - b.idx));
  const picks = scored.slice(0, count-1).map(s=>s.id);
  const chosen = [anchorId, ...picks];
  const rest = queueIds.filter(id => !chosen.includes(id));
  return { chosen, rest };
}

function parseYouTubeId(url){
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|live\/|embed\/))([\w-]{11})/);
  return m ? m[1] : null;
}
function renderCameraEmbed(url){
  if(!url) return "";
  const yt = parseYouTubeId(url);
  if(yt) return `<iframe class="camera-frame" src="https://www.youtube.com/embed/${yt}?autoplay=1&mute=1&controls=0&loop=1&playlist=${yt}" allow="autoplay; encrypted-media" allowfullscreen frameborder="0"></iframe>`;
  if(/\.m3u8(\?|$)/i.test(url)) return `<video class="camera-frame" data-hls-src="${esc(url)}" autoplay muted playsinline loop></video>`;
  if(/\.(mp4|webm|ogv)(\?|$)/i.test(url)) return `<video class="camera-frame" src="${esc(url)}" autoplay muted playsinline loop></video>`;
  return `<img class="camera-frame" src="${esc(url)}" alt="Court camera feed" />`;
}
let HlsLib = null;
async function getHls(){
  if(HlsLib) return HlsLib;
  const mod = await import("https://esm.sh/hls.js@1");
  HlsLib = mod.default;
  return HlsLib;
}
async function attachHlsVideos(){
  const els = document.querySelectorAll("video[data-hls-src]:not([data-hls-attached])");
  if(els.length===0) return;
  try{
    const Hls = await getHls();
    els.forEach(v=>{
      v.setAttribute("data-hls-attached","1");
      const src = v.getAttribute("data-hls-src");
      if(v.canPlayType("application/vnd.apple.mpegurl")){ v.src = src; }
      else if(Hls && Hls.isSupported()){ const hls = new Hls(); hls.loadSource(src); hls.attachMedia(v); }
    });
  }catch(e){ console.error("HLS load failed", e); }
}

function persist(){
  saveStatus = "saving";
  updateSaveIndicatorText();
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    saveStatus = "saved";
    updateSaveIndicatorText();
    if(!applyingRemote) pushToSupabase();
  }, 400);
}
function updateSaveIndicatorText(){
  const el = document.getElementById("saveIndicator");
  if(el){
    const cloudLabel = cloudStatus==="connecting" ? " · connecting…" : cloudStatus==="synced" ? " · cloud synced" : " · offline (local only)";
    el.textContent = (saveStatus==="saving" ? "Saving…" : "Saved") + cloudLabel;
    el.className = "save-indicator"+(saveStatus==="saved"?" saved":"");
  }
}

async function pushToSupabase(){
  if(!supabase) return;
  const json = JSON.stringify(state);
  if(json === lastPushedJSON) return;
  try{
    const { error } = await supabase.from("pickleball_sessions").update({ state }).eq("id", SESSION_ROW_ID);
    if(error) throw error;
    lastPushedJSON = json;
    cloudStatus = "synced";
  }catch(e){
    console.error("Supabase push failed", e);
    cloudStatus = "offline";
  }
  updateSaveIndicatorText();
}

function applyRemoteState(remoteState){
  if(!remoteState || typeof remoteState !== "object" || !remoteState.players || !remoteState.courts) return;
  migrateState(remoteState);
  const json = JSON.stringify(remoteState);
  if(json === lastPushedJSON) return;
  applyingRemote = true;
  state = remoteState;
  lastPushedJSON = json;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  cloudStatus = "synced";
  render();
  applyingRemote = false;
}

async function initCloudSync(){
  if(!supabase){ cloudStatus = "offline"; updateSaveIndicatorText(); return; }
  try{
    const { data, error } = await supabase.from("pickleball_sessions").select("state, updated_at").eq("id", SESSION_ROW_ID).single();
    if(error) throw error;
    const remoteState = data && data.state;
    const remoteHasData = remoteState && remoteState.players && Object.keys(remoteState.players).length>0;
    const localHasData = Object.keys(state.players).length>0;
    if(remoteHasData && !localHasData){
      applyRemoteState(remoteState);
    } else {
      lastPushedJSON = null;
      await pushToSupabase();
    }
    cloudStatus = "synced";
    updateSaveIndicatorText();

    supabase.channel("pickleball_sessions_changes")
      .on("postgres_changes", { event: "UPDATE", schema: "public", table: "pickleball_sessions", filter: `id=eq.${SESSION_ROW_ID}` },
        (payload)=>{ applyRemoteState(payload.new && payload.new.state); })
      .subscribe((status)=>{
        if(status === "CHANNEL_ERROR" || status === "TIMED_OUT"){ cloudStatus = "offline"; updateSaveIndicatorText(); }
      });
  }catch(e){
    console.error("Supabase init failed", e);
    cloudStatus = "offline";
    updateSaveIndicatorText();
  }
}

function autoFill(draft){
  const per = draft.settings.playersPerCourt;
  let changed = true, guard = 0;
  while(changed && guard < 20){
    changed = false; guard++;
    for(const court of draft.courts){
      if(court.status === "open"){
        const group = pickNextGroup(draft.queueIds, draft.players, per, draft.settings.skillMode);
        if(group){
          court.playerIds = group.chosen;
          court.status = "playing";
          court.startTime = Date.now();
          court.endTime = Date.now() + draft.settings.gameMinutes*60000;
          draft.queueIds = group.rest;
          changed = true;
        }
      }
    }
  }
}

function update(fn){
  fn(state);
  autoFill(state);
  persist();
  render();
}

// ---- session actions ----
function checkIn(name, rating){
  if(!name || !name.trim()) return;
  update(draft=>{
    const id = uid();
    draft.players[id] = { id, name: name.trim(), rating: Number(rating)||0, arrivalTime: Date.now(), gamesPlayed: 0, checkedIn: true };
    draft.queueIds.push(id);
  });
}
function checkOut(playerId){
  update(draft=>{
    draft.queueIds = draft.queueIds.filter(id=>id!==playerId);
    draft.courts.forEach(c=>{ c.playerIds = c.playerIds.filter(id=>id!==playerId); });
    if(draft.players[playerId]) draft.players[playerId].checkedIn = false;
    if(!draft.outIds.includes(playerId)) draft.outIds.push(playerId);
  });
}
function endGame(courtId){
  update(draft=>{
    const court = draft.courts.find(c=>c.id===courtId);
    if(!court || court.status!=="playing") return;
    court.playerIds.forEach(pid=>{
      if(draft.players[pid]){
        draft.players[pid].gamesPlayed += 1;
        if(draft.players[pid].checkedIn) draft.queueIds.push(pid);
      }
    });
    court.playerIds = []; court.status = "open"; court.startTime = null; court.endTime = null;
  });
}
function openCourtManually(courtId){
  update(draft=>{
    const court = draft.courts.find(c=>c.id===courtId);
    if(!court) return;
    court.playerIds.forEach(pid=>{ if(draft.players[pid] && draft.players[pid].checkedIn) draft.queueIds.push(pid); });
    court.playerIds = []; court.status="open"; court.startTime=null; court.endTime=null;
  });
}
function startCourtManually(courtId){
  update(draft=>{
    const court = draft.courts.find(c=>c.id===courtId);
    if(!court || court.playerIds.length===0) return;
    court.status = "playing"; court.startTime = Date.now(); court.endTime = Date.now() + draft.settings.gameMinutes*60000;
  });
}
function updateSettings(patch){
  update(draft=>{
    draft.settings = Object.assign({}, draft.settings, patch);
    if(patch.numCourts != null){
      const n = Math.max(1, Math.min(20, patch.numCourts));
      const cur = draft.courts.length;
      if(n > cur){
        for(let i=cur;i<n;i++) draft.courts.push(newCourt(i));
      } else if(n < cur){
        const removed = draft.courts.splice(n);
        removed.forEach(c=>{ c.playerIds.forEach(pid=>{ if(draft.players[pid]&&draft.players[pid].checkedIn) draft.queueIds.push(pid); }); });
      }
      draft.settings.numCourts = n;
    }
  });
}
function setCourtCamera(courtId, patch){
  update(draft=>{
    const court = draft.courts.find(c=>c.id===courtId);
    if(!court) return;
    Object.assign(court, patch);
  });
}
function resetAll(){
  localStorage.removeItem(STORAGE_KEY);
  state = defaultState();
  lastPushedJSON = null;
  pushToSupabase();
  render();
}

function moveToQueue(playerId, fromType, fromCourtId, insertIndex){
  update(draft=>{
    if(fromType==="queue"){ draft.queueIds = draft.queueIds.filter(id=>id!==playerId); }
    else if(fromType==="court"){ const c = draft.courts.find(c=>c.id===fromCourtId); if(c) c.playerIds = c.playerIds.filter(id=>id!==playerId); }
    let insertAt = insertIndex==null ? draft.queueIds.length : insertIndex;
    insertAt = Math.max(0, Math.min(insertAt, draft.queueIds.length));
    draft.queueIds.splice(insertAt, 0, playerId);
  });
}
function moveToCourt(playerId, fromType, fromCourtId, targetCourtId){
  update(draft=>{
    const court = draft.courts.find(c=>c.id===targetCourtId);
    if(!court) return;
    const sameCourtNoop = fromType==="court" && fromCourtId===targetCourtId;
    if(court.playerIds.length >= draft.settings.playersPerCourt && !sameCourtNoop) return;
    if(fromType==="queue"){ draft.queueIds = draft.queueIds.filter(id=>id!==playerId); }
    else if(fromType==="court"){ const c = draft.courts.find(c=>c.id===fromCourtId); if(c) c.playerIds = c.playerIds.filter(id=>id!==playerId); }
    if(!court.playerIds.includes(playerId) && court.playerIds.length < draft.settings.playersPerCourt) court.playerIds.push(playerId);
  });
}

function exportCSV(){
  const allPlayersArr = Object.values(state.players).sort((a,b)=>b.gamesPlayed-a.gamesPlayed || a.name.localeCompare(b.name));
  const rows = [["Name","Rating","Arrival Time","Games Played","Status"]];
  allPlayersArr.forEach(p=>{
    const status = p.checkedIn ? (state.courts.some(c=>c.playerIds.includes(p.id)) ? "On Court" : "Waiting") : "Checked Out";
    rows.push([p.name, p.rating, fmtTime(p.arrivalTime), p.gamesPlayed, status]);
  });
  const totalGamesPlayed = allPlayersArr.reduce((s,p)=>s+p.gamesPlayed,0);
  rows.push([]);
  rows.push(["Session Totals"]);
  rows.push(["Total Games Played (sum across players)", totalGamesPlayed]);
  rows.push(["Total Checked-in Players", allPlayersArr.length]);
  const csv = rows.map(r=>r.map(v=>{
    const s = String(v==null?"":v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(",")).join("\n");
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "pickleball-session-"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function initAuth(){

  try{
    const { data: { session } } = await supabase.auth.getSession();
    if(session) await loadProfileSilent(session.user);
  }catch(e){ console.error("Auth init failed", e); }
  supabase.auth.onAuthStateChange((event)=>{
    if(event === "SIGNED_OUT"){ authUser = null; authProfile = null; render(); }
  });
}
async function loadProfileSilent(user){
  authUser = user;
  try{
    const { data: prof } = await supabase.from("pickleball_profiles").select("*").eq("id", user.id).maybeSingle();
    authProfile = prof;
  }catch(e){ console.error("Profile load failed", e); }
  render();
}
function normalizeLoginId(v){
  v = (v||"").trim();
  if(!v) return v;
  return v.includes("@") ? v : v.toLowerCase()+"@pickleball.local";
}
async function doSignIn(emailOrUsername, password){
  const email = normalizeLoginId(emailOrUsername);
  if(!email || !password){ authError = "Enter your email/username and password."; render(); return; }
  authBusy = true; authError = ""; render();
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if(error){ authBusy = false; authError = error.message; render(); return; }
  await loadProfileSilent(data.user);
  authBusy = false; view = "app"; appTab = "dashboard"; render();
}
async function doSignUp(name, emailOrUsername, password){
  const email = normalizeLoginId(emailOrUsername);
  if(!email || !password){ authError = "Enter an email/username and password."; render(); return; }
  if(password.length < 6){ authError = "Password must be at least 6 characters."; render(); return; }
  authBusy = true; authError = ""; render();
  const { data, error } = await supabase.auth.signUp({ email, password });
  if(error){ authBusy = false; authError = error.message; render(); return; }
  if(!data.session){
    authBusy = false; authMode = "signin";
    authError = "Account created. Check your email to confirm it, then sign in.";
    render(); return;
  }
  try{
    await supabase.from("pickleball_profiles").insert({ id: data.user.id, email, display_name: (name||"").trim() || email });
  }catch(e){ console.error("Profile insert failed", e); }
  await loadProfileSilent(data.user);
  authBusy = false; view = "app"; appTab = "dashboard"; render();
}
async function doLogout(){
  if(supabase) await supabase.auth.signOut();
  authUser = null; authProfile = null; view = "kiosk"; render();
}

      <span class="brand">${icon("courts")} Pickleball Open Play <span class="demo-badge inline">Demo — resets every 5 min</span></span>
      <span id="saveIndicator" class="save-indicator${saveStatus==="saved"?" saved":""}">${saveStatus==="saving"?"Saving…":"Saved"}</span>
    </div>
    <nav class="tabs">
      <button data-action="apptab" data-tab="dashboard" class="${appTab==="dashboard"?"active":""}">${icon("courts")} Dashboard</button>
      <button data-action="apptab" data-tab="stats" class="${appTab==="stats"?"active":""}">${icon("trophy")} Stats</button>
      ${role==="admin" ? `<button data-action="apptab" data-tab="admin" class="${appTab==="admin"?"active":""}">${icon("users")} Admin</button>` : ""}
    </nav>
    <div class="appbar-right">
      <span class="role-badge ${role}">${role}</span>
      <button class="btn icon" title="View Kiosk" data-action="view-kiosk">${icon("tv")}</button>
      <button class="btn icon" title="Export CSV" data-action="export-csv">${icon("download")}</button>
      <button class="btn icon" title="Print Summary" data-action="print">${icon("print")}</button>
      <button class="btn danger" data-action="open-reset">${icon("reset")} Reset Day</button>
      <button class="btn" data-action="logout">${icon("logout")} Logout</button>
    </div>
  </header>`;

  let body;
  if(appTab === "stats") body = renderStatsTab();
  else if(appTab === "admin" && role === "admin") body = renderAdminTab();
  else body = renderDashboardTab();

  return `<div class="app">${header}<main>${body}</main></div>`;
}

function renderDashboardTab(){
  const queuedPlayers = state.queueIds.map(id=>state.players[id]).filter(Boolean);
  const now = Date.now();
  const courtsHtml = state.courts.map(court=>renderCourtCard(court, now)).join("");

  const queueHtml = queuedPlayers.length===0 ? `<li class="empty-state">Queue is empty.</li>` :
    queuedPlayers.map((p,idx)=>`
      <li class="queue-item" draggable="true" data-drag-type="queue" data-player="${p.id}" data-drop-queue-index="${idx}">
        <span class="pos">${idx+1}</span>
        <span class="name">${esc(p.name)}</span>
        <span class="rating">${p.rating.toFixed(1)}</span>
        <span class="wait" data-wait-for="${p.id}" data-arrival="${p.arrivalTime}">waiting ${fmtWait(now-p.arrivalTime)}</span>
      </li>`).join("");

  const settings = state.settings;

  return `
    <div class="org-grid">
      <div style="display:flex;flex-direction:column;gap:18px;">
        <div class="panel">
          <h2>${icon("courts")} Courts (${state.courts.length})</h2>
          <div class="courts-grid">${courtsHtml}</div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:18px;">
        <div class="panel">
          <h2>Check In Player</h2>
          <div class="checkin-form">
            <input id="checkinName" placeholder="Player name" />
            <div class="row">
              <select id="checkinRating">
                ${["2.0","2.5","3.0","3.5","4.0","4.5","5.0","5.5"].map(r=>`<option value="${r}" ${r==="3.5"?"selected":""}>${r} rating</option>`).join("")}
              </select>
              <button class="btn primary" data-action="check-in">Check In</button>
            </div>
          </div>
        </div>
        <div class="panel">
          <h2>Waitlist Queue (${queuedPlayers.length})</h2>
          <ul class="queue-list" data-drop-queue="end">${queueHtml}</ul>
        </div>
        <div class="panel">
          <h2>Settings</h2>
          <div class="settings-grid">
            <label>Number of courts
              <input type="number" min="1" max="20" value="${settings.numCourts}" data-setting="numCourts" />
            </label>
            <label>Game length (minutes)
              <input type="number" min="1" max="60" value="${settings.gameMinutes}" data-setting="gameMinutes" />
            </label>
            <label>"Ending soon" warning (minutes left)
              <input type="number" min="0" max="30" value="${settings.endingSoonMinutes}" data-setting="endingSoonMinutes" />
            </label>
            <label>Players per court
              <input type="number" min="2" max="4" step="2" value="${settings.playersPerCourt}" data-setting="playersPerCourt" />
            </label>
            <label>Skill matching
              <div class="toggle-row">
                <button data-action="skill-mode" data-mode="off" class="${settings.skillMode==="off"?"active":""}">Fairness only</button>
                <button data-action="skill-mode" data-mode="balance" class="${settings.skillMode==="balance"?"active":""}">Group similar</button>
              </div>
            </label>
          </div>
        </div>
      </div>
    </div>`;
}

function renderCourtCard(court, now){
  const cls = courtStatusClass(court, state.settings, now);
  const remain = court.status==="playing" ? court.endTime - now : null;
  const pillLabel = court.status==="open" ? "Open" : cls==="timeup" ? "Time up!" : cls==="ending" ? "Ending soon" : "In progress";
  const pillCls = court.status==="open" ? "open" : (cls==="playing" ? "playing" : "ending");
  const playersHtml = court.playerIds.map(pid=>{
    const p = state.players[pid];
    if(!p) return "";
    return `<li class="player-chip" draggable="true" data-drag-type="court" data-court="${court.id}" data-player="${p.id}">
      <span>${esc(p.name)}</span><span class="rating">${p.rating.toFixed(1)}</span>
    </li>`;
  }).join("");
  const emptySlots = Math.max(0, state.settings.playersPerCourt - court.playerIds.length);
  const emptyHtml = Array.from({length:emptySlots}).map(()=>`<li class="court-slot-empty">drop player here</li>`).join("");

  return `
  <div class="court-card ${cls}" data-court-card="${court.id}" data-drop-court="${court.id}">
    <div class="court-head">
      <span class="court-name">${esc(court.label)}</span>
      <span class="status-pill ${pillCls}" data-court-pill="${court.id}">${pillLabel}</span>
    </div>
    ${court.status==="playing" ? `<div class="court-timer" data-timer-for="${court.id}" data-end="${court.endTime}">${fmtClock(remain)}</div>` : ""}
    <ul class="court-players">${playersHtml}${emptyHtml}</ul>
    <div class="court-actions">
      ${court.status==="playing"
        ? `<button class="btn small" data-action="end-game" data-court="${court.id}">End Game</button>`
        : `<button class="btn small" ${court.playerIds.length===0?"disabled":""} data-action="start-game" data-court="${court.id}">Start Game</button>`}
      ${court.playerIds.length>0 ? `<button class="btn small" data-action="open-court" data-court="${court.id}">Clear</button>` : ""}
    </div>
    <div class="camera-config">
      <label class="camera-toggle">
        <input type="checkbox" data-camera-enabled="${court.id}" ${court.cameraEnabled?"checked":""} /> ${icon("camera")} Camera feed
      </label>
      ${court.cameraEnabled ? `<input type="text" placeholder="YouTube live / .m3u8 / .mp4 / MJPEG URL" value="${esc(court.cameraUrl||"")}" data-camera-url="${court.id}" />` : ""}
    </div>
  </div>`;
}

function renderRosterTable(allPlayersArr){
  if(allPlayersArr.length===0) return `<div class="empty-state">No players checked in yet.</div>`;
  return `
    <div style="max-height:420px;overflow-y:auto;">
    <table class="roster">
      <thead><tr><th>#</th><th>Name</th><th>Rating</th><th>Arrival</th><th>Games</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${allPlayersArr.map((p,i)=>{
          const onCourt = state.courts.find(c=>c.playerIds.includes(p.id));
          const inQueue = state.queueIds.includes(p.id);
          let statusHtml;
          if(!p.checkedIn) statusHtml = `<span class="badge">Checked out</span>`;
          else if(onCourt) statusHtml = `<span class="badge court">On ${esc(onCourt.label)}</span>`;
          else if(inQueue) statusHtml = `<span class="badge queue">Waiting</span>`;
          else statusHtml = `<span class="badge">Idle</span>`;
          return `<tr>
            <td>${i+1}</td>
            <td>${esc(p.name)}</td><td>${p.rating.toFixed(1)}</td><td>${fmtTime(p.arrivalTime)}</td><td>${p.gamesPlayed}</td>
            <td>${statusHtml}</td>
            <td>${p.checkedIn ? `<button class="btn small" data-action="check-out" data-player="${p.id}">Check out</button>` : ""}</td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>
    </div>`;
}

function renderStatsTab(){
  const allPlayersArr = Object.values(state.players).sort((a,b)=>b.gamesPlayed-a.gamesPlayed || a.name.localeCompare(b.name));
  const activeCount = allPlayersArr.filter(p=>p.checkedIn).length;
  const totalGames = allPlayersArr.reduce((s,p)=>s+p.gamesPlayed,0);
  const activeCourts = state.courts.filter(c=>c.status==="playing").length;
  const mvp = allPlayersArr[0];
  return `
    <div class="panel">
      <h2>${icon("chart")} Session Stats</h2>
      <div class="stats-tiles">
        <div class="stat-tile"><span class="stat-num">${allPlayersArr.length}</span><span class="stat-label">Players</span></div>
        <div class="stat-tile"><span class="stat-num">${activeCount}</span><span class="stat-label">Checked In</span></div>
        <div class="stat-tile"><span class="stat-num">${totalGames}</span><span class="stat-label">Games Played</span></div>
        <div class="stat-tile"><span class="stat-num">${activeCourts}</span><span class="stat-label">Courts Active</span></div>
      </div>
      ${mvp && mvp.gamesPlayed>0 ? `
      <div class="mvp-card">
        ${icon("trophy","lg")}
        <div><div class="mvp-label">Most Active Player</div><div class="mvp-name">${esc(mvp.name)}</div></div>
        <div class="mvp-games">${mvp.gamesPlayed} games</div>
      </div>` : ""}
      <h2 style="margin-top:6px;">Player Stat Sheet</h2>
      ${renderRosterTable(allPlayersArr)}
    </div>`;
}

  return `
    <div class="panel">
      <h2>${icon("users")} User Management</h2>

      <div style="max-height:480px;overflow-y:auto;">
      <table class="roster">
        <thead><tr><th>Email</th><th>Name</th><th>Role</th><th>Joined</th><th></th></tr></thead>
        <tbody>

          <tr>

  if(!confirmModal) return "";
  return `
  <div class="modal-backdrop" data-action="cancel-confirm">
    <div class="modal">
      <h3>${esc(confirmModal.title)}</h3>
      <p style="color:var(--muted);font-size:14px;">${esc(confirmModal.message)}</p>
      <div class="actions">
        <button class="btn" data-action="cancel-confirm">Cancel</button>
        <button class="btn danger" data-action="confirm-confirm">${esc(confirmModal.confirmLabel||"Confirm")}</button>

function renderPrintArea(){
  const allPlayersArr = Object.values(state.players).sort((a,b)=>b.gamesPlayed-a.gamesPlayed || a.name.localeCompare(b.name));
  const totalGames = allPlayersArr.reduce((s,p)=>s+p.gamesPlayed,0);
  const mostActive = [...allPlayersArr].sort((a,b)=>b.gamesPlayed-a.gamesPlayed).slice(0,5);
  return `
    <h2 style="margin-top:0;">Pickleball Open Play — Session Summary</h2>
    <p>Date: ${new Date(state.sessionStart).toLocaleDateString()}</p>
    <p><strong>Total games played (sum across players):</strong> ${totalGames}</p>
    <p><strong>Players checked in:</strong> ${allPlayersArr.length}</p>
    <h3>Most Active Players</h3>
    <ol>${mostActive.map(p=>`<li>${esc(p.name)} — ${p.gamesPlayed} games</li>`).join("")}</ol>
    <h3>Full Roster</h3>
    <table>
      <thead><tr><th>Name</th><th>Rating</th><th>Arrival</th><th>Games Played</th></tr></thead>
      <tbody>${allPlayersArr.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.rating.toFixed(1)}</td><td>${fmtTime(p.arrivalTime)}</td><td>${p.gamesPlayed}</td></tr>`).join("")}</tbody>
    </table>`;
}

// lightweight per-second update: timers + wait times + status classes + kiosk clock, no full re-render
function tickTimers(){
  const now = Date.now();
  document.querySelectorAll("[data-timer-for]").forEach(el=>{
    const end = Number(el.getAttribute("data-end"));
    el.textContent = fmtClock(end-now);
  });
  document.querySelectorAll("[data-wait-for]").forEach(el=>{
    const arrival = Number(el.getAttribute("data-arrival"));
    el.textContent = "waiting "+fmtWait(now-arrival);
  });
  const clockEl = document.getElementById("kioskClock");
  if(clockEl) clockEl.textContent = new Date(now).toLocaleTimeString([], {hour:"numeric",minute:"2-digit",second:"2-digit"});
  state.courts.forEach(court=>{
    const cls = courtStatusClass(court, state.settings, now);
    document.querySelectorAll(`[data-court-card="${court.id}"]`).forEach(el=>{
      el.classList.remove("open","playing","ending","timeup");
      el.classList.add(cls);
    });
    document.querySelectorAll(`[data-court-pill="${court.id}"]`).forEach(el=>{
      const label = court.status==="open" ? "Open" : cls==="timeup" ? (el.classList.contains("kiosk-status-pill")?"TIME'S UP":"Time up!") : cls==="ending" ? "Ending soon" : "In progress";
      el.textContent = label;
      el.classList.remove("open","playing","ending");
      el.classList.add(court.status==="open"?"open":(cls==="playing"?"playing":"ending"));
    });
    if(court.status==="playing" && court.endTime <= now){
      if(!alertedCourts.has(court.id)){ alertedCourts.add(court.id); beep(); }
    } else {
      alertedCourts.delete(court.id);
    }
  });
}

function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.15;
    o.start(); setTimeout(()=>{ o.stop(); ctx.close(); }, 350);
  }catch(e){}
}

// ---------------- Event delegation ----------------
document.addEventListener("click", (e)=>{
  const t = e.target;
  const actionEl = t.closest("[data-action]");
  if(actionEl){
    const action = actionEl.getAttribute("data-action");
    switch(action){
      case "view-kiosk": view = "kiosk"; render(); break;
      case "enter-app-or-login":
        if(authUser){ view = "app"; appTab = "dashboard"; } else { view = "login"; authMode = "signin"; authError = ""; }
        render();
        break;
      case "toggle-auth-mode": authMode = authMode==="signup" ? "signin" : "signup"; authError = ""; render(); break;
      case "signin": {
        const email = document.getElementById("authEmail").value.trim();
        const password = document.getElementById("authPassword").value;
        doSignIn(email, password);
        break;
      }
      case "signup": {
        const name = document.getElementById("authName").value;
        const email = document.getElementById("authEmail").value.trim();
        const password = document.getElementById("authPassword").value;
        doSignUp(name, email, password);
        break;
      }
      case "logout": doLogout(); break;
      case "apptab": {
        const tab = actionEl.getAttribute("data-tab");
        appTab = tab;
        if(tab === "admin"){ adminProfiles = null; render(); loadAdminProfilesAndRender(); }
        else render();
        break;
      }
      case "remove-user": {
        const uidv = actionEl.getAttribute("data-uid");
        confirmModal = { title: "Remove this user?", message: "They will lose organizer/admin access immediately. This cannot be undone.", confirmLabel: "Remove access" };
        pendingConfirm = ()=>removeUserProfile(uidv);
        render();
        break;
      }
      case "export-csv": exportCSV(); break;
      case "print":
        showPrintArea = true; render();
        setTimeout(()=>{ window.print(); showPrintArea=false; render(); }, 150);
        break;
      case "open-reset":
        confirmModal = { title: "Reset the whole session?", message: "This clears all players, courts, queue, and stats to start a fresh open-play day. This cannot be undone.", confirmLabel: "Yes, reset everything" };
        pendingConfirm = resetAll;
        render();
        break;
      case "cancel-confirm": confirmModal = null; pendingConfirm = null; render(); break;
      case "confirm-confirm": {
        const fn = pendingConfirm;
        confirmModal = null; pendingConfirm = null;
        if(fn) fn();
        render();
        break;
      }
      case "check-in": {
        const nameEl = document.getElementById("checkinName");
        const ratingEl = document.getElementById("checkinRating");
        checkIn(nameEl.value, ratingEl.value);
        break;
      }
      case "check-out": checkOut(actionEl.getAttribute("data-player")); break;
      case "end-game": endGame(actionEl.getAttribute("data-court")); break;
      case "open-court": openCourtManually(actionEl.getAttribute("data-court")); break;
      case "start-game": startCourtManually(actionEl.getAttribute("data-court")); break;
      case "skill-mode": updateSettings({skillMode: actionEl.getAttribute("data-mode")}); break;
    }
    return;
  }
  if(t.classList && t.classList.contains("modal-backdrop")){
    confirmModal = null; pendingConfirm = null; render();
  }
});

document.addEventListener("keydown", (e)=>{
  if(e.target && e.target.id === "checkinName" && e.key === "Enter"){
    const nameEl = document.getElementById("checkinName");
    const ratingEl = document.getElementById("checkinRating");
    checkIn(nameEl.value, ratingEl.value);
  }
  if(e.target && (e.target.id === "authEmail" || e.target.id === "authPassword" || e.target.id === "authName") && e.key === "Enter"){
    const btn = document.querySelector('[data-action="signin"], [data-action="signup"]');
    if(btn) btn.click();
  }
});

document.addEventListener("change", (e)=>{
  const t = e.target;
  if(t.matches && t.matches("[data-setting]")){
    const field = t.getAttribute("data-setting");
    const val = Number(t.value);
    if(!Number.isNaN(val)) updateSettings({[field]: val});
  } else if(t.matches && t.matches("[data-camera-enabled]")){
    setCourtCamera(t.getAttribute("data-camera-enabled"), { cameraEnabled: t.checked });
  } else if(t.matches && t.matches("[data-camera-url]")){
    setCourtCamera(t.getAttribute("data-camera-url"), { cameraUrl: t.value.trim() });
  } else if(t.matches && t.matches("[data-role-select]")){
    setUserRole(t.getAttribute("data-role-select"), t.value);
  }
});

// Drag and drop
document.addEventListener("dragstart", (e)=>{
  const el = e.target.closest("[data-drag-type]");
  if(!el) return;
  dragData = {
    playerId: el.getAttribute("data-player"),
    fromType: el.getAttribute("data-drag-type"),
    fromCourtId: el.getAttribute("data-court") || null,
  };
  e.dataTransfer.effectAllowed = "move";
  try{ e.dataTransfer.setData("text/plain", dragData.playerId); }catch(err){}
});

document.addEventListener("dragover", (e)=>{
  const courtEl = e.target.closest("[data-drop-court]");
  const queueEl = e.target.closest("[data-drop-queue], [data-drop-queue-index]");
  if(courtEl || queueEl){
    e.preventDefault();
    if(courtEl) courtEl.classList.add("dragover");
    const qi = e.target.closest("[data-drop-queue-index]");
    if(qi) qi.classList.add("dragover");
  }
});
document.addEventListener("dragleave", (e)=>{
  const courtEl = e.target.closest("[data-drop-court]");
  if(courtEl) courtEl.classList.remove("dragover");
  const qi = e.target.closest("[data-drop-queue-index]");
  if(qi) qi.classList.remove("dragover");
});
document.addEventListener("drop", (e)=>{
  if(!dragData) return;
  const courtEl = e.target.closest("[data-drop-court]");
  const qi = e.target.closest("[data-drop-queue-index]");
  const queueListEl = e.target.closest("[data-drop-queue]");
  e.preventDefault();
  if(courtEl){
    moveToCourt(dragData.playerId, dragData.fromType, dragData.fromCourtId, courtEl.getAttribute("data-drop-court"));
  } else if(qi){
    moveToQueue(dragData.playerId, dragData.fromType, dragData.fromCourtId, Number(qi.getAttribute("data-drop-queue-index")));
  } else if(queueListEl){
    moveToQueue(dragData.playerId, dragData.fromType, dragData.fromCourtId, null);
  }
  dragData = null;
});

// Global 1s tick for timers/wait-times/status colors/kiosk clock
setInterval(tickTimers, 1000);

render();
initCloudSync();
initAuth();
</script>
